# MHVTL GUI Nginx Configuration
# /etc/nginx/conf.d/mhvtl-gui-nginx.conf

upstream mhvtl_gui {
    server 127.0.0.1:8000;
}

# The standard ports, so the console is at https://your-server/ with nothing
# to remember. If this host already runs something on 80 or 443 - another web
# application, a reverse proxy - nginx will refuse to start beside it:
#
#     nginx: [emerg] bind() to 0.0.0.0:80 failed (98: Address already in use)
#
# Then change the two `listen` lines and the redirect below to a free pair,
# usually 8080 and 8443, and reload. Nothing else in this file depends on the
# numbers.

# Plain HTTP: nothing is served here, it only points at the secure port.
server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/mhvtl-gui-access.log;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;
    # HTTP/2: `http2 on;` on nginx 1.25 and later, `listen 443 ssl http2;`
    # before it. Left out so the file works on both.

    # The installer puts a self-signed certificate here when there is none.
    # Replace both files with your own and reload nginx; nothing else changes.
    ssl_certificate     /etc/pki/tls/certs/mhvtl-gui.crt;
    ssl_certificate_key /etc/pki/tls/private/mhvtl-gui.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:MHVTL:10m;
    ssl_session_timeout 1d;

    # Logging
    access_log /var/log/nginx/mhvtl-gui-access.log;
    error_log /var/log/nginx/mhvtl-gui-error.log;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Max upload size (for potential media uploads)
    client_max_body_size 100M;

    # Static files
    location /static/ {
        alias /var/www/mhvtl/static/;

        # These names carry no content hash - css/mhvtl-console.css is that
        # file at every version - so a browser cannot tell one version from
        # another by its URL. "immutable" with a 30-day life told it never to
        # ask again, and an upgraded console kept serving the old stylesheet
        # and the old scripts to everyone who had visited before: new panels
        # drawn with rules that were not there, and no error anywhere.
        #
        # no-cache does not mean "do not store". It means "store it, then ask
        # before using it": the browser sends If-None-Match, nginx answers 304
        # from the ETag, nothing is transferred, and a change is seen at once.
        add_header Cache-Control "public, no-cache";
    }

    # Media files
    location /media/ {
        alias /var/www/mhvtl/media/;
        expires 7d;
    }

    # Django application
    location / {
        proxy_pass http://mhvtl_gui;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (if needed for future features)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Health check endpoint
    location /health/ {
        proxy_pass http://mhvtl_gui;
        proxy_set_header Host $host;
        access_log off;
    }
}
